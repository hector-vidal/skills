name: verificacion estatica

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    # Nothing here reaches the network after setup, and nothing writes back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version from package.json#packageManager, then Node,
      # then runs pnpm install, refusing an install the lockfile does not describe.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: true
          require-lockfile: true

      - name: markdownlint
        run: pnpm run lint:md
